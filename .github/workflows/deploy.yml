name: CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      rollback:
        description: 'Rollback to previous version'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Determine deployment environment and version
  prepare:
    name: Prepare Deployment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      version: ${{ steps.set-version.outputs.version }}
      image_tag: ${{ steps.set-version.outputs.image_tag }}
      deploy_sha: ${{ steps.set-version.outputs.deploy_sha }}
      should_deploy: ${{ steps.check-changes.outputs.should_deploy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        id: check-changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            # Check if backend or frontend changed
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD || echo "")
            if echo "$CHANGED_FILES" | grep -qE "^(backend/|frontend/|docker/|nginx/)"; then
              echo "should_deploy=true" >> $GITHUB_OUTPUT
            else
              echo "should_deploy=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

      - name: Set version
        id: set-version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "image_tag=$VERSION" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "version=sha-$SHORT_SHA" >> $GITHUB_OUTPUT
            echo "image_tag=sha-$SHORT_SHA" >> $GITHUB_OUTPUT
          fi
          echo "deploy_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  # Build and push Docker images
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    environment: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
      packages: write

    outputs:
      backend_image: ${{ steps.image-tags.outputs.backend_image }}
      frontend_image: ${{ steps.image-tags.outputs.frontend_image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=ref,event=branch
            latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ needs.prepare.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ needs.prepare.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set image tags output
        id: image-tags
        run: |
          echo "backend_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ needs.prepare.outputs.image_tag }}" >> $GITHUB_OUTPUT
          echo "frontend_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ needs.prepare.outputs.image_tag }}" >> $GITHUB_OUTPUT

      - name: Sign images with Cosign (optional)
        if: env.COSIGN_KEY != ''
        uses: sigstore/cosign-installer@v3
        continue-on-error: true
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.should_deploy == 'true' && needs.prepare.outputs.environment == 'staging'
    environment:
      name: staging
      url: ${{ steps.deploy-url.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure Container Apps (Staging)
        if: secrets.AZURE_CREDENTIALS != ''
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy staging containers
        run: |
          echo "Deploying to staging environment..."
          echo "Backend Image: ${{ needs.build.outputs.backend_image }}"
          echo "Frontend Image: ${{ needs.build.outputs.frontend_image }}"
          
          # Azure Container Apps deployment
          if command -v az &> /dev/null && [ -n "${{ secrets.AZURE_RESOURCE_GROUP }}" ]; then
            az containerapp update \
              --name ${{ secrets.STAGING_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ needs.build.outputs.backend_image }} \
              --set-env-vars "DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}" "SECRET_KEY=${{ secrets.STAGING_SECRET_KEY }}" "FLASK_ENV=staging"
          fi

      - name: Deploy to AWS ECS (Staging)
        if: secrets.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Deploying to AWS ECS staging..."
          # aws ecs update-service --cluster staging --service flask-react-todo --force-new-deployment

      - name: Deploy to VPS via SSH
        if: secrets.VPS_HOST != ''
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/flask-react-todo
            docker pull ${{ needs.build.outputs.backend_image }}
            docker pull ${{ needs.build.outputs.frontend_image }}
            docker-compose -f docker-compose.prod.yml up -d
            docker system prune -f

      - name: Set deployment URL
        id: deploy-url
        run: |
          echo "url=https://staging.flask-react-todo.example.com" >> $GITHUB_OUTPUT

      - name: Run health checks
        run: |
          echo "Running health checks..."
          sleep 30
          curl -f https://staging.flask-react-todo.example.com/api/health || exit 1

      - name: Notify deployment status
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Staging deployment ${{ job.status }}: ${{ needs.prepare.outputs.version }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.should_deploy == 'true' && needs.prepare.outputs.environment == 'production'
    environment:
      name: production
      url: ${{ steps.deploy-url.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment backup
        run: |
          echo "Creating backup of current production deployment..."
          echo "BACKUP_TAG=backup-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV

      - name: Blue-Green Deployment
        run: |
          echo "Starting blue-green deployment..."
          echo "Version: ${{ needs.prepare.outputs.version }}"
          echo "Deploy SHA: ${{ needs.prepare.outputs.deploy_sha }}"
          
          # Deploy to green environment
          echo "Deploying to green environment..."
          
          # Health check on green
          echo "Health checking green environment..."
          
          # Switch traffic to green
          echo "Switching traffic to green..."

      - name: Deploy to Azure Container Apps (Production)
        if: secrets.AZURE_CREDENTIALS != ''
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update production containers
        run: |
          if command -v az &> /dev/null && [ -n "${{ secrets.AZURE_RESOURCE_GROUP }}" ]; then
            az containerapp update \
              --name ${{ secrets.PRODUCTION_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ needs.build.outputs.backend_image }} \
              --set-env-vars "DATABASE_URL=${{ secrets.PRODUCTION_DATABASE_URL }}" "SECRET_KEY=${{ secrets.PRODUCTION_SECRET_KEY }}" "FLASK_ENV=production"
          fi

      - name: Deploy to AWS ECS (Production)
        if: secrets.AWS_ACCESS_KEY_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "Deploying to AWS ECS production..."
          # aws ecs update-service --cluster production --service flask-react-todo --force-new-deployment

      - name: Set deployment URL
        id: deploy-url
        run: |
          echo "url=https://flask-react-todo.example.com" >> $GITHUB_OUTPUT

      - name: Run production health checks
        run: |
          echo "Running production health checks..."
          sleep 30
          
          # API health check
          curl -f https://flask-react-todo.example.com/api/health || exit 1
          
          # Frontend health check
          curl -f https://flask-react-todo.example.com || exit 1
          
          # Database connectivity check
          curl -f https://flask-react-todo.example.com/api/health/db || exit 1

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            docker-compose.prod.yml
            nginx/nginx.conf

      - name: Notify deployment status
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Production deployment ${{ job.status }}: ${{ needs.prepare.outputs.version }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Rollback Job
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event.inputs.rollback == 'true'
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous deployment
        id: previous
        run: |
          PREVIOUS_SHA=$(git rev-parse HEAD~1)
          echo "previous_sha=$PREVIOUS_SHA" >> $GITHUB_OUTPUT
          echo "previous_tag=sha-${PREVIOUS_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Rollback to previous version
        run: |
          echo "Rolling back to ${{ steps.previous.outputs.previous_tag }}"
          
          # Restore previous container images
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "Rolling back production..."
          else
            echo "Rolling back staging..."
          fi

      - name: Verify rollback
        run: |
          echo "Verifying rollback..."
          sleep 10
          # curl -f https://flask-react-todo.example.com/api/health || exit 1

      - name: Notify rollback status
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Rollback to ${{ steps.previous.outputs.previous_tag }} ${{ job.status }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Smoke Tests
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: |
          pip install requests pytest

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          
          # Test API endpoints
          # python -m pytest tests/smoke/ -v
          
          echo "Smoke tests completed"

  # Deployment Summary
  deploy-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [prepare, build, deploy-staging, deploy-production, smoke-tests]
    if: always()

    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Prepare | ${{ needs.prepare.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Staging | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Production | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.prepare.outputs.environment }}" >> $GITHUB_STEP_SUMMARY

      - name: Check deployment status
        if: |
          needs.prepare.result == 'failure' ||
          needs.build.result == 'failure' ||
          (needs.deploy-staging.result == 'failure' && needs.prepare.outputs.environment == 'staging') ||
          (needs.deploy-production.result == 'failure' && needs.prepare.outputs.environment == 'production')
        run: |
          echo "Deployment failed"
          exit 1
